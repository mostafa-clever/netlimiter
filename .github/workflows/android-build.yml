name: Build No Quota (GitHub APK + Play Store AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore from Secrets (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/wifiguard-release.jks
          fi

      - name: Build GitHub Release APK & Play Store Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleGithubRelease bundlePlayStoreRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Rename GitHub Release APK
        run: cp app/build/outputs/apk/github/release/app-github-release.apk WifiGuard.apk

      - name: Upload Play Store AAB (Private Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: noquota-playstore-aab
          path: app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab

      - name: Publish Direct GitHub APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          gh release create latest WifiGuard.apk --title "No Quota v1.0.${{ github.run_number }}" --notes "build:${{ github.run_number }} — Signed Release APK."
