name: Build No Quota (GitHub APK + Play Store AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/wifiguard-release.jks
          elif [ -f app/wifiguard-release.jks ]; then
            echo "Using repository release keystore."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR build without keystore secret; generating ephemeral test keystore..."
            keytool -genkeypair -v \
              -keystore app/wifiguard-release.jks \
              -alias "${KEY_ALIAS:-wifiguard}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-wifiguard2026}" \
              -keypass "${KEY_PASSWORD:-wifiguard2026}" \
              -dname "CN=NoQuota, OU=App, O=NoQuota, L=Cairo, S=Egypt, C=EG"
          else
            echo "::error::Missing KEYSTORE_BASE64 secret and app/wifiguard-release.jks; refusing to publish with an ephemeral signing key."
            exit 1
          fi

      - name: Build GitHub Release APK & Play Store Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleGithubRelease bundlePlayStoreRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Rename GitHub Release APK
        run: cp app/build/outputs/apk/github/release/app-github-release.apk WifiGuard.apk

      - name: Upload Play Store AAB (Private Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: noquota-playstore-aab
          path: app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab

      - name: Publish Direct GitHub APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="No Quota v1.0.${{ github.run_number }}"
          NOTES="build:${{ github.run_number }} — Signed Release APK."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest WifiGuard.apk --clobber
            gh release edit latest --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create latest WifiGuard.apk --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          fi
